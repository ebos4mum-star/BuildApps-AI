# Local-development configuration for `supabase start` (requires Docker). No cloud resources.
#
# The API and DB ports are deliberately BELOW Linux's ephemeral range (32768-60999). The Supabase defaults
# (54321/54322) sit inside it, so an outgoing connection can transiently hold one as its source port and
# make `supabase start` fail with "address already in use" (seen intermittently on CI runners).
# Only keys known to be valid across CLI versions are set here; other services keep their defaults.
[api]
port = 14321
[db]
port = 14322
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true
[auth.email]
enable_confirmations = false
