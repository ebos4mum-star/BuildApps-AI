name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Resolving "latest" calls the GitHub API from a shared runner IP and is occasionally rate limited
      # (even when authenticated), so retry up to 3 times with a pause between attempts.
      - uses: supabase/setup-cli@v1
        id: cli1
        continue-on-error: true
        with:
          version: latest
      - name: Wait before retrying CLI setup
        if: steps.cli1.outcome == 'failure'
        run: sleep 45
      - uses: supabase/setup-cli@v1
        id: cli2
        if: steps.cli1.outcome == 'failure'
        continue-on-error: true
        with:
          version: latest
      - name: Wait before retrying CLI setup
        if: steps.cli1.outcome == 'failure' && steps.cli2.outcome == 'failure'
        run: sleep 90
      - uses: supabase/setup-cli@v1
        if: steps.cli1.outcome == 'failure' && steps.cli2.outcome == 'failure'
        with:
          version: latest
      - name: Start local Supabase (Docker, no cloud resources)
        # retried: shared runners occasionally have a host port already bound
        run: |
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,vector,edge-runtime,logflare,realtime,storage-api && exit 0
            echo "supabase start failed (attempt $attempt); retrying"
            supabase stop --no-backup || true
            sleep 5
          done
          exit 1
      - name: Run real-Supabase integration tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          REQUIRE_SUPABASE_INTEGRATION=1 pnpm --filter @buildapps/server test:integration
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
